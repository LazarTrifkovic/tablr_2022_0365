services:
  gateway:
    build: ./gateway
    ports:
      - "8000:8000"
    environment:
      JWT_SECRET: dev-jwt-secret-change-in-prod
    depends_on:
      - menu
      - orders
      - barkds
      - auth
      - payments

  menu:
    build: ./services/menu
    environment:
      MONGO_URL: mongodb://menu-db:27017/menu
    depends_on:
      menu-db:
        condition: service_healthy

  menu-db:
    image: mongo:7
    volumes:
      - menu-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10

  orders:
    build: ./services/orders
    environment:
      DATABASE_URL: postgresql+asyncpg://orders:orders@orders-db:5432/orders
      MENU_URL: http://menu:8000
      BARKDS_URL: http://barkds:8000
      QR_SECRET: dev-secret-change-in-prod
      APP_ENV: dev
    depends_on:
      orders-db:
        condition: service_healthy

  orders-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
      POSTGRES_DB: orders
    volumes:
      - orders-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders"]
      interval: 5s
      timeout: 3s
      retries: 10

  barkds:
    build: ./services/barkds
    environment:
      MONGO_URL: mongodb://barkds-db:27017/barkds
      ORDERS_URL: http://orders:8000
      QR_SECRET: dev-secret-change-in-prod
    depends_on:
      barkds-db:
        condition: service_healthy

  barkds-db:
    image: mongo:7
    volumes:
      - barkds-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth:
    build: ./services/auth
    environment:
      DATABASE_URL: postgresql+asyncpg://auth:auth@auth-db:5432/auth
      MENU_URL: http://menu:8000
      JWT_SECRET: dev-jwt-secret-change-in-prod
      APP_ENV: dev
    depends_on:
      auth-db:
        condition: service_healthy

  auth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
      POSTGRES_DB: auth
    volumes:
      - auth-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth"]
      interval: 5s
      timeout: 3s
      retries: 10

  payments:
    build: ./services/payments
    environment:
      ORDERS_URL: http://orders:8000
      QR_SECRET: dev-secret-change-in-prod

  guest:
    build: ./frontend/guest
    ports:
      - "5173:80"
    depends_on:
      - gateway

  bar:
    build: ./frontend/bar
    ports:
      - "5174:80"
    depends_on:
      - gateway

volumes:
  menu-data:
  orders-data:
  barkds-data:
  auth-data:
