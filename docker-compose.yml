services:
  gateway:
    build: ./gateway
    ports:
      - "8000:8000"
    depends_on:
      - menu
      - orders
      - barkds
      - auth
      - payments

  menu:
    build: ./services/menu
    environment:
      MONGO_URL: mongodb://menu-db:27017/menu
    depends_on:
      menu-db:
        condition: service_healthy

  menu-db:
    image: mongo:7
    volumes:
      - menu-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10

  orders:
    build: ./services/orders

  barkds:
    build: ./services/barkds

  auth:
    build: ./services/auth

  payments:
    build: ./services/payments

volumes:
  menu-data:
